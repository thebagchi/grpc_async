syntax = "proto3";

package sample;

option go_package = "github.com/thebagchi/grpc_async/gen/sample";

message Chunk {
  string payload = 1;
  uint64 seq     = 2;
}

message Summary {
  uint64 count = 1;
  string note  = 2;
}

service SampleService {
  rpc Unary (Chunk) returns (Summary) {
    // Unary: one request, one response.
  }

  rpc ServerStream (Chunk) returns (stream Chunk) {
    // Server-streaming: one request, a stream of responses.
  }

  rpc ClientStream (stream Chunk) returns (Summary) {
    // Client-streaming: a stream of requests, one response.
  }

  rpc BidiStream (stream Chunk) returns (stream Chunk) {
    // Bidirectional streaming: a stream of requests and a stream of responses.
  }
}
